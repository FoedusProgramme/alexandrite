# Usage.
usage.line=Usage: alexandrite {options}
usage.line_command=\u0020\u0020\u0020\u0020\u0020\u0020\u0020alexandrite <command> [<argument>...] [{help}]
usage.about=Runs Alexandrite until it receives SIGTERM or SIGINT, or carries out a command.
usage.area={area}:
usage.options=Options:
usage.option.config=the config file, by default {default}
usage.option.data_dir=the data directory, by default {default}
usage.option.cache_dir=the cache directory, by default {default}
usage.option.plain=plain lines, without glyphs, colours or prompts drawn on the terminal
usage.option.version=print the version and exit
usage.option.help=print this help, or a command's own after it, and exit
usage.defaults=Each default comes from ALEXANDRITE_CONFIG, ALEXANDRITE_DATA_DIR and ALEXANDRITE_CACHE_DIR when set,\n\
  else from XDG_CONFIG_HOME, XDG_DATA_HOME and XDG_CACHE_HOME, else from the platform's own locations.\n\
  The cache is the data directory's "cache" directory when only the data directory is named.\n\
  Commands that change the config go through the Alexandrite that runs with the same data directory,\n\
  or write the file themselves when none runs.\n\
  Commands print Chinese when the locale (LC_ALL, LC_MESSAGES, LANG, else the system's) is Chinese.
usage.of=Usage: {usage}
usage.summary={summary}.
usage.needs_value={option} needs a value.
usage.given_twice={option} is given more than once.
usage.invalid_path={option} names no valid path: {reason}.
usage.unknown_option=Unknown option {option}.
usage.unknown_command=Unknown command {command}.
usage.needs_subcommand={command} needs one of {subcommands}.
usage.unknown_subcommand=Unknown command {command} {given}: {command} takes {subcommands}.
usage.no_argument={command} takes no argument.
usage.logs_lines=-n needs a positive number.
usage.config_get=config get takes one key.
usage.config_set=config set needs a key and a value.
usage.config_unset=config unset needs one key.
usage.secret_set=secret set needs one name, such as DEEPSEEK_API_KEY.
usage.secret_unset=secret unset needs one name.
usage.agent_add=agent add needs one agent id.
usage.agent_remove=agent remove needs one agent id.
usage.model=model takes one model.
usage.channel_type=channel add needs the channel type: telegram.
usage.channel_unknown=channel add knows the channel type telegram, not {type}.
usage.channel_name=channel add telegram takes one instance name.
usage.admin_id=--admin needs a Telegram user id, such as 123456789.
usage.mcp_add=mcp add needs the server's name.
usage.mcp_target=mcp add needs either --url or a command to run.
usage.mcp_remove=mcp remove needs the server's name.
usage.mcp_login=mcp login needs the server's name.
usage.mcp_logout=mcp logout needs the server's name.
usage.manual=manual takes one topic, or --search and the words to look for.
usage.pair=pair needs the code to approve.
usage.deny=deny needs the code to deny.
usage.unpair=unpair needs one chat address, such as {example}.
usage.no_chat='{chat}' is no chat address, such as {example}.
usage.no_id='{id}' is no {what}: use lowercase letters, digits and -, such as main.
usage.no_model='{model}' is no model: write <endpoint>/<model>.
usage.no_key='{key}' is no config key ({reason}): write keys joined by dots, such as agent.agents.main.model, \
  and a key with a dot in brackets and quotes, such as models["gpt-4.1"].
usage.no_secret_name='{name}' is no variable name: use letters, digits and _, such as DEEPSEEK_API_KEY.
usage.init_step='{step}' is no step of init: name model, telegram, admin, language or service.
usage.init_provider='{provider}' is no provider: name one of {providers}.
usage.init_only_skip=--only and --skip do not go together.
usage.login=login needs the service to log in to: pleochroic.
usage.login_unknown=login knows the service pleochroic, not {service}.
usage.login_self_hosted=login needs --service-url and --service-token together, for a self-hosted service, or neither.
usage.logout=logout needs the service to sign out of: pleochroic.
usage.logout_unknown=logout knows the service pleochroic, not {service}.
what.agent_id=agent id
what.instance_name=instance name
what.endpoint=endpoint name

# The command table.
area.run=Run
area.setup=Setup
area.config=Config
area.secrets=Secrets
area.shortcuts=Shortcuts
area.chats=Chats, answered by the Alexandrite that runs with the same data directory
area.pleochroic=Pleochroic account
area.help=Help
help.changes=The running Alexandrite checks the change as a start would, writes it and says what needs a restart; \
  with none running, the command checks and writes the file itself. With --restart the command restarts the \
  service once the change is written.
help.json=With --json it prints JSON for scripts.
command.run=run Alexandrite in the foreground until SIGTERM or SIGINT
command.start=start the background service and wait until Alexandrite is ready
command.stop=stop the background service, or the Alexandrite that runs in the foreground
command.restart=restart the background service and wait until Alexandrite is ready
command.status=show whether Alexandrite runs, its channel instances and the service
command.status.help=It exits 0 only when a running Alexandrite answers on its control socket, and 69 otherwise. {json}
command.logs=print the service's log, and follow it with -f
command.logs.help=Prints the last 200 lines unless -n names another number.
command.init=set Alexandrite up: the model, Telegram, its admin, the language and zone, the config and the service
command.init.help=Each step asks first and can be skipped, and redone later with --only <step>; the steps are \
  model, telegram, admin, language and service. An existing config file is changed only where a step sets \
  something, and only once you agree, or with --force.\n\n\
  With --non-interactive it asks nothing and takes what the flags and the environment give: --provider (deepseek, \
  openrouter, openai-compatible, anthropic-compatible, lmstudio, openai-responses), --base-url, --model (the \
  first is the agent's default), the key from ALEXANDRITE_API_KEY or the provider's own variable, such as \
  DEEPSEEK_API_KEY, the bot token from ALEXANDRITE_TELEGRAM_TOKEN, and --admin for the bot's admin. A step whose \
  input is missing is skipped.\n\n\
  Without --admin the admin is claimed by a one-time code: init shows it, you send it to the bot from your own \
  Telegram account, and the account that sends it becomes the bot's admin, its direct chat paired and the agent's \
  home.
command.doctor=check Java, the config, the endpoints and Telegram, the secrets, the disk and the service
command.doctor.help=It exits 1 when a check fails. {json}
command.update=update to the latest release, or to <release>
command.update.help=Runs the install script in its update mode, which checks the new release against the config \
  file before it switches to it and restarts the service.
command.uninstall=remove the service, the program and, unless --keep-data, the config, secrets and data
command.uninstall.help=Asks before it removes anything, unless --yes.
command.config=change the config in a menu on the terminal
command.config.help=The menu shows the agents, the models and endpoints, the channels, the MCP servers, the heartbeats, \
  the language and zone, and any other key with their values, and changes them as config set does: each change says \
  whether it took effect at once, and the menu offers to restart Alexandrite at the end when one needs it. Esc goes \
  back. Without a terminal, or with --plain, it prints this usage; config get, set, unset, edit, check and path \
  change the config from scripts.
command.config.get=print the value at <key>, or the whole config file
command.config.get.help=A key is the config's path, such as agent.agents.main.model, with a key that holds a dot in \
  brackets and quotes, such as models["gpt-4.1"]; values print as the file \
  writes them. With --json a string prints as JSON as well.
command.config.set=set the value at <key>
command.config.set.help=The value is JSON, or a string when it does not read as JSON. A key with a dot, such as \
  a model id, goes in brackets and quotes, and the whole path in single quotes for the shell: config set \
  'providers.openai-responses.endpoints.main.models["gpt-6.1-sol"].contextWindow' 200000. {changes}
command.config.unset=remove the value at <key>
command.config.unset.help={changes}
command.config.edit=edit a copy of the config file in $VISUAL or $EDITOR and write it once it passes
command.config.edit.help=A copy that does not pass is offered for another edit, and the file stays as it was. \
  {changes}
command.config.check=check the config file as a start would
command.config.check.help=It exits 78 when the file does not pass. {json}
command.config.path=print where the config file is
command.config.path.help=With --json it prints the secrets file, the data and the cache directories as well.
command.secret.set=save a secret, typed without echo, in secrets.env beside the config file
command.secret.set.help=The config refers to it as ${env:NAME}; a variable of the environment wins over the \
  file's. The value is read from the terminal, or from the input's first line when it is no terminal.
command.secret.list=list the names of the saved secrets
command.secret.unset=remove a saved secret
command.agent.list=list the agents, their models and the channel instances they serve
command.agent.add=add an agent
command.agent.add.help=--channel attaches it to a channel instance, --default makes it the instance's default \
  agent; an agent that serves no channel is a profile, which needs a --description. {changes}
command.agent.remove=remove an agent
command.agent.remove.help={changes}
command.model=show the agents' models, or set an agent's default model
command.model.help=Without --agent it sets the model of the only agent, or of the only default one. {changes}
command.channel.add=add a Telegram bot, whose token Telegram checks first, and claim its admin
command.channel.add.help=The instance is named main unless <name> says. The token, typed without echo, goes \
  into secrets.env as ALEXANDRITE_TELEGRAM_<NAME>_TOKEN unless --token-variable names another, and the only agent \
  serves it unless --agent names one. Without --admin the admin is claimed by a one-time code that you send to the \
  bot from your own Telegram account; --admin names the admins' Telegram user ids instead, for scripts. {changes}
command.mcp.add=add an MCP server reached over HTTP or run as a command
command.mcp.add.help=Put -- before a command whose arguments start with -. {changes}
command.mcp.list=list the MCP servers, with their states when Alexandrite runs
command.mcp.remove=remove an MCP server
command.mcp.remove.help={changes}
command.mcp.login=log the running Alexandrite in to an MCP server reached over HTTP
command.mcp.login.help=Prints the address to open in a browser, then takes the address the browser ended on, \
  from the terminal or from --address.
command.mcp.logout=forget the login to an MCP server
command.pairings=list the chats waiting to be paired, then the paired chats
command.pair=pair the chat that was offered <code>
command.deny=drop the request of the chat that was offered <code>
command.unpair=unpair a chat, such as telegram:work:123456789
command.chats=list the paired chats and the agent that serves each
command.login=log in to a Pleochroic account, or name a self-hosted standalone-service
command.login.help=Without --service-url, this is a device login: it shows a code and a link, waits until you \
  approve it at the portal, then writes providers.pleochroic.endpoints.default and, where the account is \
  entitled, tools.web.searchBackend and tools.web.fetchBackend. With --service-url and --service-token it skips \
  the portal and uses that standalone-service and token as is. The key always goes into secrets.env, never into \
  the config file itself.
command.logout=sign out of the Pleochroic account, revoking its key at the service
command.account=show the signed-in Pleochroic account: its plan, scopes, credits and entitlements
command.account.help=Calls the service's GET /service with the signed-in key. {json}
command.sync.enable=turn on two-way config and secret sync, off by default
command.sync.enable.help=Sync stays off until this runs. --prefer sets the policy a later conflict is resolved by \
  (local, remote or merge; merge by default): local or remote always keeps that side's content, merge takes the \
  union of an object document's keys, the locally-changed one winning on a key both sides hold. Run alexandrite \
  sync now to sync for the first time.
command.sync.disable=turn sync off; what was already synced is left as it is
command.sync.now=sync once: providers' endpoints, agents, mcp servers, app settings, secrets and skills
command.sync.now.help=Pulls the change feed since the last sync, pushes what changed locally, and resolves \
  anything that changed on both sides by the policy alexandrite sync enable set. A dangerous pulled change (any \
  create, change or delete of a skill or an mcp server; a provider endpoint; an instructions file; an agent's \
  permission, sandbox, tools, channels, workspace or inline instructions; a settings value that is a URL or secret \
  reference; or overwriting an existing secret) is held for review instead of applied; run alexandrite sync review \
  to see it. A skill's own push stays automatic; only a pulled skill change is held back. --dry-run reports what \
  would happen without writing or staging anything. {json}
command.sync.status=show whether sync is on, its policy, how many items it tracks and how many changes are pending
command.sync.review=list pulled changes held back for review, with why and what would change
command.sync.review.help=Each pending change is shown with the reason it was held back and the local content it \
  would replace. {json}
command.sync.apply=apply pending changes: --all, or the keys sync review printed
command.sync.apply.help=Re-decides each named change against current local content, so a local edit made since it \
  was staged is not silently lost, then applies it the same way a sync would have.
command.sync.discard=discard pending changes without applying them: --all, or the keys sync review printed
command.sync.discard.help=The change is not applied; its remote revision is recorded so the same version is not \
  staged again, but a later change at the service still will be.
command.manual=print the agent's manual: its pages, one page, or the sections that match --search
command.manual.help=The manual is what the agent reads with its manual.read tool, in English. A page is named by its \
  topic, such as permissions, or as <plugin>/<topic> where several plugins have that topic.
manual.index=The pages of the agent's manual; print one with alexandrite manual <topic>:
manual.unknown=The manual has no page {topic}. Run alexandrite manual to list its pages.
manual.ambiguous=Several plugins have a page {topic}: {pages}. Name one of them.
manual.no_match=No section of the manual matches {query}.

