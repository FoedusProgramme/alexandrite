# Usage.
usage.line=用法：alexandrite {options}
usage.line_command=\u0020\u0020\u0020\u0020\u0020\u0020alexandrite <命令> [<参数>...] [{help}]
usage.about=运行 Alexandrite，直到收到 SIGTERM 或 SIGINT；或执行一条命令。
usage.area={area}：
usage.options=选项：
usage.option.config=配置文件，默认为 {default}
usage.option.data_dir=数据目录，默认为 {default}
usage.option.cache_dir=缓存目录，默认为 {default}
usage.option.plain=只输出纯文本行，不用符号、颜色，也不在终端上绘制提示
usage.option.version=打印版本号后退出
usage.option.help=打印本帮助（放在命令后则打印该命令的帮助）后退出
usage.defaults=各默认值依次取自 ALEXANDRITE_CONFIG、ALEXANDRITE_DATA_DIR 和 ALEXANDRITE_CACHE_DIR（若已设置），\n\
  其次取自 XDG_CONFIG_HOME、XDG_DATA_HOME 和 XDG_CACHE_HOME，最后取平台自己的位置。\n\
  只指定了数据目录时，缓存目录是数据目录下的 "cache" 目录。\n\
  修改配置的命令会交给使用同一数据目录运行的 Alexandrite 处理；没有在运行的实例时，由命令自己写入文件。\n\
  当语言环境（LC_ALL、LC_MESSAGES、LANG，否则为系统设置）是中文时，命令输出中文。
usage.of=用法：{usage}
usage.summary={summary}。
usage.needs_value={option} 需要一个值。
usage.given_twice={option} 给出了不止一次。
usage.invalid_path={option} 不是有效的路径：{reason}。
usage.unknown_option=未知选项 {option}。
usage.unknown_command=未知命令 {command}。
usage.needs_subcommand={command} 需要以下之一：{subcommands}。
usage.unknown_subcommand=未知命令 {command} {given}：{command} 可接 {subcommands}。
usage.no_argument={command} 不接受参数。
usage.logs_lines=-n 需要一个正整数。
usage.config_get=config get 只接受一个键。
usage.config_set=config set 需要一个键和一个值。
usage.config_unset=config unset 需要一个键。
usage.secret_set=secret set 需要一个名称，例如 DEEPSEEK_API_KEY。
usage.secret_unset=secret unset 需要一个名称。
usage.agent_add=agent add 需要一个智能体 id。
usage.agent_remove=agent remove 需要一个智能体 id。
usage.model=model 只接受一个模型。
usage.channel_type=channel add 需要渠道类型：telegram。
usage.channel_unknown=channel add 只认识渠道类型 telegram，不认识 {type}。
usage.channel_name=channel add telegram 只接受一个实例名。
usage.admin_id=--admin 需要一个 Telegram 用户 id，例如 123456789。
usage.mcp_add=mcp add 需要服务器的名称。
usage.mcp_target=mcp add 需要 --url 或一条要运行的命令，二者选一。
usage.mcp_remove=mcp remove 需要服务器的名称。
usage.mcp_login=mcp login 需要服务器的名称。
usage.mcp_logout=mcp logout 需要服务器的名称。
usage.manual=manual 只接受一个主题，或 --search 加上要查找的词。
usage.pair=pair 需要要批准的配对码。
usage.deny=deny 需要要拒绝的配对码。
usage.unpair=unpair 需要一个聊天地址，例如 {example}。
usage.no_chat='{chat}' 不是聊天地址，聊天地址形如 {example}。
usage.no_id='{id}' 不是有效的{what}：请使用小写字母、数字和 -，例如 main。
usage.no_model='{model}' 不是模型：请写成 <端点>/<模型>。
usage.no_key='{key}' 不是配置键（{reason}）：请用点连接各级键，例如 agent.agents.main.model；含点的键写在方括号和引号里，例如 models["gpt-4.1"]。
usage.no_secret_name='{name}' 不是变量名：请使用字母、数字和 _，例如 DEEPSEEK_API_KEY。
usage.init_step='{step}' 不是 init 的步骤：可用 model、telegram、admin、language 或 service。
usage.init_provider='{provider}' 不是模型提供方：可用 {providers} 之一。
usage.init_only_skip=--only 和 --skip 不能同时使用。
usage.init_self_hosted=init 的 --service-url 和 --service-token 必须同时给出（用于自建 Pleochroic 服务），或者都不给。
usage.login=login 需要指定要登录的服务：pleochroic。
usage.login_unknown=login 只支持服务 pleochroic，不支持 {service}。
usage.login_self_hosted=login 的 --service-url 和 --service-token 必须同时给出（用于自建服务），或者都不给。
usage.logout=logout 需要指定要退出登录的服务：pleochroic。
usage.logout_unknown=logout 只支持服务 pleochroic，不支持 {service}。
what.agent_id=智能体 id
what.instance_name=实例名
what.endpoint=端点名

# The command table.
area.run=运行
area.setup=安装与设置
area.config=配置
area.secrets=密钥
area.shortcuts=快捷命令
area.chats=聊天（由使用同一数据目录运行的 Alexandrite 回答）
area.pleochroic=Pleochroic 账户
area.help=帮助
help.changes=正在运行的 Alexandrite 会像启动时那样检查改动、写入文件，并说明哪些部分需要重启；没有在运行的实例时，由命令自己检查并写入文件。\
  加上 --restart 时，命令在写入改动后重启服务。
help.json=加上 --json 时输出供脚本使用的 JSON。
command.run=在前台运行 Alexandrite，直到收到 SIGTERM 或 SIGINT
command.start=启动后台服务，并等待 Alexandrite 就绪
command.stop=停止后台服务，或在前台运行的 Alexandrite
command.restart=重启后台服务，并等待 Alexandrite 就绪
command.status=显示 Alexandrite 是否在运行、它的渠道实例和后台服务
command.status.help=只有当正在运行的 Alexandrite 在控制套接字上应答时才以 0 退出，否则以 69 退出。{json}
command.logs=打印服务的日志，加 -f 持续跟踪
command.logs.help=打印最后 200 行，除非 -n 指定了其他行数。
command.init=设置 Alexandrite：模型、Telegram、管理员、语言和时区、配置文件以及后台服务
command.init.help=每一步都会先询问，可以跳过，之后用 --only <步骤> 重新执行；步骤有 model、telegram、admin、language 和 \
  service。已有的配置文件只在某一步设置了内容的地方改动，并且要先征得你同意，或加上 --force。\n\n\
  加上 --non-interactive 时不提任何问题，只采用参数和环境给出的内容：--provider（anthropic-compatible、deepseek、\
  lmstudio、openai-responses、openai-compatible、openrouter、pleochroic）、--base-url、--model（第一个是智能体的默认\
  模型）、取自 ALEXANDRITE_API_KEY 或提供方自己的变量（例如 DEEPSEEK_API_KEY）的密钥、取自 ALEXANDRITE_TELEGRAM_TOKEN \
  的机器人令牌，以及指定机器人管理员的 --admin。Pleochroic 不用密钥，而是登录：设备登录会打印一个代码和链接，\
  等待你批准；加上 --service-url 和 --service-token 时则直接按原样使用该自建 standalone-service。缺少输入的步骤会\
  被跳过。\n\n\
  不给 --admin 时，管理员通过一次性验证码认领：init 显示验证码，你用自己的 Telegram 账号把它发给机器人，\
  发送它的账号就成为机器人的管理员，与它的私聊被配对，并成为智能体的主聊天。
command.doctor=检查 Java、配置、端点和 Telegram、密钥、磁盘以及后台服务
command.doctor.help=有检查未通过时以 1 退出。{json}
command.update=更新到最新版本，或更新到 <版本>
command.update.help=以更新模式运行安装脚本：它会先用配置文件检查新版本，再切换过去并重启服务。
command.uninstall=移除后台服务、程序，以及（除非加 --keep-data）配置、密钥和数据
command.uninstall.help=移除任何东西之前都会先询问，除非加上 --yes。
command.config=在终端的菜单中修改配置
command.config.help=菜单列出智能体、模型和接口、渠道、MCP 服务器、心跳、语言和时区以及任意其他键的当前值，并像 config set 那样修改它们：每次修改都会说明是否已立即生效，若有修改需要重启，菜单在结束时会提议重启 Alexandrite。按 Esc 返回上一级。没有终端或加上 --plain 时打印本用法；在脚本中请用 config get、set、unset、edit、check 和 path 修改配置。
command.config.get=打印 <键> 处的值，或整个配置文件
command.config.get.help=键是配置中的路径，例如 agent.agents.main.model，含点的键写在方括号和引号里，例如 models["gpt-4.1"]；值按文件中的写法打印。加上 --json 时字符串也按 JSON 打印。
command.config.set=设置 <键> 处的值
command.config.set.help=值按 JSON 读取，读不成 JSON 时按字符串处理。含点的键（例如模型 id）写在方括号和引号里，整个路径再用单引号括起来交给 shell：config set 'providers.openai-responses.endpoints.main.models["gpt-6.1-sol"].contextWindow' 200000。{changes}
command.config.unset=移除 <键> 处的值
command.config.unset.help={changes}
command.config.edit=在 $VISUAL 或 $EDITOR 中编辑配置文件的副本，通过检查后再写入
command.config.edit.help=没有通过检查的副本会让你再次编辑，配置文件保持原样。{changes}
command.config.check=像启动时那样检查配置文件
command.config.check.help=文件没有通过检查时以 78 退出。{json}
command.config.path=打印配置文件的位置
command.config.path.help=加上 --json 时还会打印密钥文件、数据目录和缓存目录。
command.secret.set=把一个密钥（输入时不回显）保存到配置文件旁的 secrets.env
command.secret.set.help=配置中以 ${env:NAME} 引用它；环境中的同名变量优先于文件中的值。值从终端读取；不是终端时读取输入的第一行。
command.secret.list=列出已保存密钥的名称
command.secret.unset=移除一个已保存的密钥
command.agent.list=列出智能体、它们的模型和所服务的渠道实例
command.agent.add=添加一个智能体
command.agent.add.help=--channel 把它挂到一个渠道实例上，--default 让它成为该实例的默认智能体；不服务任何渠道的智能体是一个画像，\
  需要提供 --description。{changes}
command.agent.remove=移除一个智能体
command.agent.remove.help={changes}
command.model=显示各智能体的模型，或设置某个智能体的默认模型
command.model.help=不加 --agent 时，设置唯一智能体（或唯一默认智能体）的模型。{changes}
command.channel.add=添加一个 Telegram 机器人（先由 Telegram 检查令牌），并认领它的管理员
command.channel.add.help=实例名为 main，除非 <名称> 另行指定。令牌在输入时不回显，保存到 secrets.env 中的 \
  ALEXANDRITE_TELEGRAM_<NAME>_TOKEN，除非 --token-variable 指定了别的变量名；由唯一的智能体服务它，除非 --agent 另行指定。\
  不给 --admin 时，管理员通过一次性验证码认领：你用自己的 Telegram 账号把它发给机器人；供脚本使用时，也可以用 --admin 直接给出\
  管理员的 Telegram 用户 id。{changes}
command.mcp.add=添加一个通过 HTTP 访问或作为命令运行的 MCP 服务器
command.mcp.add.help=如果命令的参数以 - 开头，请在命令前加上 --。{changes}
command.mcp.list=列出 MCP 服务器；Alexandrite 运行时一并显示它们的状态
command.mcp.remove=移除一个 MCP 服务器
command.mcp.remove.help={changes}
command.mcp.login=让正在运行的 Alexandrite 登录一个通过 HTTP 访问的 MCP 服务器
command.mcp.login.help=打印一个要在浏览器中打开的地址，然后从终端或 --address 读取浏览器最后停留的地址。
command.mcp.logout=忘掉对某个 MCP 服务器的登录
command.pairings=列出等待配对的聊天，以及已配对的聊天
command.pair=配对收到 <配对码> 的聊天
command.deny=拒绝收到 <配对码> 的聊天的请求
command.unpair=取消一个聊天的配对，例如 telegram:work:123456789
command.chats=列出已配对的聊天以及服务各聊天的智能体
command.login=登录 Pleochroic 账户，或指定一个自建的 standalone-service
command.login.help=不带 --service-url 时是设备登录：显示一个代码和链接，等待你在门户中批准，然后写入 \
  providers.pleochroic.endpoints.default，并在账户拥有相应权益时写入 tools.web.searchBackend 和 \
  tools.web.fetchBackend。带 --service-url 和 --service-token 时跳过门户，直接按原样使用该自建服务和 token。\
  key 始终写入 secrets.env，绝不写入配置文件本身。
command.logout=退出 Pleochroic 账户登录，并在服务端吊销这把 key
command.account=显示已登录的 Pleochroic 账户：套餐、scope、credits 和权益
command.account.help=用已登录的 key 调用服务的 GET /service。{json}
command.sync.enable=开启双向同步配置和 secret，默认关闭
command.sync.enable.help=同步默认关闭，要跑这条命令才会开。--prefer 设定之后遇到冲突时的策略（local、remote 或 \
  merge，默认 merge）：local 或 remote 总是保留那一侧的内容；merge 取一份对象文档两侧键的并集，两侧都改过的键以本地\
  为准。之后运行 alexandrite sync now 做第一次同步。
command.sync.disable=关闭同步；已经同步过的内容保持原样
command.sync.now=同步一次：provider 的 endpoint、agent、mcp server、app 的设置、secret 和 skill
command.sync.now.help=从上次同步起拉取变更流，推送本地的改动，两侧都改过的由 alexandrite sync enable 设的策略解决。\
  危险的拉取改动（skill 或 mcp server 的任何增/改/删、provider 的 endpoint、instructions 文件、agent 的 \
  permission、sandbox、tools、channels、workspace 或内置 instructions、settings 里是 URL 或 secret 引用的值，\
  或是会覆盖已有 secret 的改动）会被留待审核而不直接应用；运行 alexandrite sync review 查看。skill 本身的推送\
  仍会自动进行，只有拉取到的 skill 改动才会被留待审核。--dry-run 只报告会发生什么，不写入也不留待审核。{json}
command.sync.status=显示同步是否开启、用什么策略、跟踪了多少项，以及有多少项改动待审核
command.sync.review=列出被留待审核的拉取改动，说明原因和会改变什么
command.sync.review.help=每项待审核改动都会显示被留下的原因，以及它会取代的本地内容。{json}
command.sync.apply=应用待处理改动：--all，或 sync review 打印出的 key
command.sync.apply.help=对每个指定的改动，按当前本地内容重新判断（所以在它被留待审核之后做的本地改动不会被悄悄\
  丢弃），然后按同步本应做的方式应用它。
command.sync.discard=丢弃待处理改动而不应用它们：--all，或 sync review 打印出的 key
command.sync.discard.help=这项改动不会被应用；它的远端版本号会被记下，所以同一个版本不会再被留待审核，但服务端\
  之后再改动它时仍会。
command.manual=打印智能体的手册：页面列表、某一页，或与 --search 匹配的段落
command.manual.help=手册是智能体用 manual.read 工具读取的内容，为英文。页面以主题命名，例如 permissions；\
  若多个插件都有该主题，则写作 <插件>/<主题>。
manual.index=智能体手册的页面；用 alexandrite manual <主题> 打印其中一页：
manual.unknown=手册中没有页面 {topic}。运行 alexandrite manual 可列出所有页面。
manual.ambiguous=多个插件都有页面 {topic}：{pages}。请指明其中一个。
manual.no_match=手册中没有与 {query} 匹配的段落。

# Common.
config.missing={file} 处没有配置文件。请用 alexandrite init 创建。
config.unreadable=无法读取配置文件 {file}：{reason}
config.no_object=配置文件 {file} 不是一个 JSON 对象：请用 alexandrite config edit 修正。
unexpected_answer=正在运行的 Alexandrite 给出了意外的应答。
unreachable=无法连接正在运行的 Alexandrite：{reason}

# Telegram.
bot.plain=机器人 {id}
bot.username=机器人 @{username}（{id}）
bot.named=机器人 {name}（@{username}，{id}）
bot.unreachable=无法连接 {base} 上的 Telegram：{reason}
bot.refused=Telegram 拒绝了这个机器人令牌。
bot.http=Telegram 对这个机器人令牌返回了 HTTP {status}。
bot.no_bot=Telegram 对 getMe 的应答中没有机器人。
bot.no_id=Telegram 对 getMe 的应答中没有机器人 id。
bot.belongs=这个令牌属于{bot}。
bot.checking=正在向 Telegram 查询这个令牌……
claim.unreachable=无法连接 {base} 上的 Telegram：{reason}
claim.webhook=这个机器人把更新发送到 webhook {url}，因此这里读不到它们：请用 Bot API 的 deleteWebhook 移除 webhook，\
  或用 --admin 指定管理员。
claim.running=Alexandrite 正在运行并读取这个机器人的更新，认领会与它争抢更新：请用 alexandrite stop 停止它后重新执行这一步，\
  或用 --admin 指定管理员。
claim.send=请用你自己的 Telegram 账号把这个验证码发给{bot}：{code}
claim.send_code=请用你自己的 Telegram 账号把这个验证码发给{bot}：
claim.link=或者打开 {link} 并点击“开始”。
claim.waiting=最多等待 {minutes} 分钟。不含验证码的消息会被忽略，因此其他人无法认领这个机器人。
claim.countdown=正在等待验证码，还剩 {left}
claim.conflict=另有程序在读取这个机器人的更新（Telegram 说：{reason}）。请停止它（如果是 Alexandrite，用 alexandrite stop）\
  后重试，或用 --admin 指定管理员。
claim.failed=Telegram 没有交出机器人的消息：{reason}
claim.ignored=已忽略来自 {sender} 的一条不含验证码的消息。
claim.welcome=你现在是这个机器人的管理员了。Alexandrite 运行后会在这里回答。
claim.done={sender} 发来了验证码，成为机器人的管理员。
claim.timeout=验证码在 {minutes} 分钟内没有到达：请重新执行这一步，或用 --admin 指定管理员。

